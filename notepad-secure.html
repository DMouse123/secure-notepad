<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Notepad</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@joplin/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css" disabled>
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        mono: ['"SF Mono"', '"Fira Code"', '"Cascadia Code"', 'monospace'],
        sans: ['"Inter"', 'system-ui', 'sans-serif'],
      },
      animation: {
        'shake': 'shake 0.4s ease-in-out',
        'modal-in': 'modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
      },
      keyframes: {
        shake: {
          '0%, 100%': { transform: 'translateX(0)' },
          '20%, 60%': { transform: 'translateX(-6px)' },
          '40%, 80%': { transform: 'translateX(6px)' },
        },
        'modal-in': {
          from: { opacity: '0', transform: 'translateY(20px) scale(0.95)' },
          to: { opacity: '1', transform: 'translateY(0) scale(1)' },
        },
      },
    },
  },
}
</script>
<style>
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .animate-shake { animation: shake 0.4s ease-in-out; }

  /* Custom scrollbar — thin overlay style */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(0,0,0,0.15) transparent;
  }
  .dark * {
    scrollbar-color: rgba(255,255,255,0.12) transparent;
  }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.15);
    border-radius: 99px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-corner { background: transparent; }
  html.dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }
  html.dark ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

  /* Dark mode overrides for code/pre */
  .dark #richEditor code, .dark #preview code, .dark #splitPreview code {
    color: #e4e4e7;
  }
  .dark #richEditor pre, .dark #preview pre, .dark #splitPreview pre {
    color: #e4e4e7;
  }
  .dark #richEditor, .dark #preview, .dark #splitPreview {
    color: #e4e4e7;
  }
  .dark #richEditor th, .dark #preview th, .dark #splitPreview th {
    color: #e4e4e7;
  }
  .dark #richEditor td, .dark #preview td, .dark #splitPreview td {
    color: #e4e4e7;
  }
  .dark #richEditor a, .dark #preview a, .dark #splitPreview a {
    color: #a78bfa;
  }
  .dark #richEditor blockquote, .dark #preview blockquote, .dark #splitPreview blockquote {
    color: #d4d4d8;
  }
  .dark #richEditor h1, .dark #richEditor h2, .dark #richEditor h3,
  .dark #preview h1, .dark #preview h2, .dark #preview h3,
  .dark #splitPreview h1, .dark #splitPreview h2, .dark #splitPreview h3 {
    color: #fafafa;
  }

  /* Rich editor styles */
  #richEditor {
    font-family: 'Inter', system-ui, sans-serif;
  }
  #richEditor:empty::before {
    content: 'Start typing your note...';
    color: #a1a1aa;
  }
  .dark #richEditor:empty::before {
    color: #52525b;
  }
  #richEditor h1 { font-size: 1.875rem; font-weight: 700; margin: 0.5em 0 0.25em; line-height: 1.3; }
  #richEditor h2 { font-size: 1.5rem; font-weight: 600; margin: 0.5em 0 0.25em; line-height: 1.35; }
  #richEditor h3 { font-size: 1.25rem; font-weight: 600; margin: 0.5em 0 0.25em; line-height: 1.4; }
  #richEditor p { margin: 0.4em 0; }
  #richEditor ul, #richEditor ol { padding-left: 1.5em; margin: 0.4em 0; }
  #richEditor li { margin: 0.15em 0; }
  #richEditor blockquote {
    border-left: 3px solid #8b5cf6;
    padding-left: 1em;
    margin: 0.5em 0;
    opacity: 0.85;
  }
  #richEditor code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.875em;
    padding: 0.15em 0.4em;
    border-radius: 4px;
    background: #f4f4f5;
  }
  .dark #richEditor code {
    background: #27272a;
  }
  #richEditor pre {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.875em;
    padding: 1em;
    border-radius: 8px;
    margin: 0.5em 0;
    overflow-x: auto;
    background: #f4f4f5;
  }
  .dark #richEditor pre {
    background: #18181b;
  }
  #richEditor pre code {
    padding: 0;
    background: none;
  }
  #richEditor a { color: #7c3aed; text-decoration: underline; }
  .dark #richEditor a { color: #a78bfa; }
  #richEditor hr { border: none; border-top: 1px solid #e4e4e7; margin: 1em 0; }
  .dark #richEditor hr { border-color: #3f3f46; }
  #richEditor img { max-width: 100%; border-radius: 8px; margin: 0.5em 0; }
  #richEditor table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
  #richEditor th, #richEditor td { border: 1px solid #e4e4e7; padding: 0.4em 0.75em; text-align: left; }
  .dark #richEditor th, .dark #richEditor td { border-color: #3f3f46; }
  #richEditor th { font-weight: 600; background: #f4f4f5; }
  .dark #richEditor th { background: #27272a; }

  /* Preview & split preview styles */
  #preview, #splitPreview {
    font-family: 'Inter', system-ui, sans-serif;
  }
  #preview h1, #splitPreview h1 { font-size: 1.875rem; font-weight: 700; margin: 0.5em 0 0.25em; line-height: 1.3; }
  #preview h2, #splitPreview h2 { font-size: 1.5rem; font-weight: 600; margin: 0.5em 0 0.25em; line-height: 1.35; }
  #preview h3, #splitPreview h3 { font-size: 1.25rem; font-weight: 600; margin: 0.5em 0 0.25em; line-height: 1.4; }
  #preview p, #splitPreview p { margin: 0.4em 0; }
  #preview ul, #preview ol, #splitPreview ul, #splitPreview ol { padding-left: 1.5em; margin: 0.4em 0; }
  #preview ul, #splitPreview ul { list-style: disc; }
  #preview ol, #splitPreview ol { list-style: decimal; }
  #preview li, #splitPreview li { margin: 0.15em 0; }
  #preview blockquote, #splitPreview blockquote {
    border-left: 3px solid #8b5cf6;
    padding-left: 1em;
    margin: 0.5em 0;
    opacity: 0.85;
  }
  #preview code, #splitPreview code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.875em;
    padding: 0.15em 0.4em;
    border-radius: 4px;
    background: #f4f4f5;
  }
  .dark #preview code, .dark #splitPreview code { background: #27272a; }
  #preview pre, #splitPreview pre {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.875em;
    padding: 1em;
    border-radius: 8px;
    margin: 0.5em 0;
    overflow-x: auto;
    background: #f4f4f5;
  }
  .dark #preview pre, .dark #splitPreview pre { background: #18181b; }
  #preview pre code, #splitPreview pre code { padding: 0; background: none; }
  #preview a, #splitPreview a { color: #7c3aed; text-decoration: underline; }
  .dark #preview a, .dark #splitPreview a { color: #a78bfa; }
  #preview hr, #splitPreview hr { border: none; border-top: 1px solid #e4e4e7; margin: 1em 0; }
  .dark #preview hr, .dark #splitPreview hr { border-color: #3f3f46; }
  #preview img, #splitPreview img { max-width: 100%; border-radius: 8px; margin: 0.5em 0; }
  #preview table, #splitPreview table { border-collapse: collapse; margin: 0.5em 0; width: 100%; }
  #preview th, #preview td, #splitPreview th, #splitPreview td { border: 1px solid #e4e4e7; padding: 0.4em 0.75em; text-align: left; }
  .dark #preview th, .dark #preview td, .dark #splitPreview th, .dark #splitPreview td { border-color: #3f3f46; }
  #preview th, #splitPreview th { font-weight: 600; background: #f4f4f5; }
  .dark #preview th, .dark #splitPreview th { background: #27272a; }

  /* Task lists */
  #richEditor ul.contains-task-list,
  #preview ul.contains-task-list,
  #splitPreview ul.contains-task-list { list-style: none; padding-left: 0.5em; }
  #richEditor .task-list-item,
  #preview .task-list-item,
  #splitPreview .task-list-item { display: flex; align-items: baseline; gap: 0.4em; }
  #richEditor .task-list-item input,
  #preview .task-list-item input,
  #splitPreview .task-list-item input { margin: 0; accent-color: #8b5cf6; }

  /* Highlight / mark */
  #richEditor mark, #preview mark, #splitPreview mark {
    background: #fde68a; color: #1c1917; padding: 0.1em 0.25em; border-radius: 3px;
  }
  .dark #richEditor mark, .dark #preview mark, .dark #splitPreview mark {
    background: #854d0e; color: #fef3c7;
  }

  /* Fullscreen */
  .fullscreen { position: fixed !important; inset: 0; z-index: 40; }
  .fullscreen #richEditor,
  .fullscreen #codeWrap { max-width: none; }
  .fullscreen #preview { max-width: 48rem; margin: 0 auto; }

  /* Collapsible sections */
  #richEditor details, #preview details, #splitPreview details {
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    padding: 0.5em 1em;
    margin: 0.5em 0;
  }
  .dark #richEditor details, .dark #preview details, .dark #splitPreview details {
    border-color: #3f3f46;
  }
  #richEditor summary, #preview summary, #splitPreview summary {
    cursor: pointer;
    font-weight: 600;
    padding: 0.25em 0;
  }
  #richEditor summary:hover, #preview summary:hover, #splitPreview summary:hover { opacity: 0.8; }

  /* Print styles */
  @media print {
    header, footer, #formatBar, #toast, .modal-overlay, #readerControls,
    #findBar, #tocPanel, #splitDivider, #splitPreview { display: none !important; }

    *, *::before, *::after {
      position: static !important;
      overflow: visible !important;
      height: auto !important;
      max-height: none !important;
      flex: none !important;
    }

    html, body {
      height: auto !important;
      overflow: visible !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    #editorArea, #editorContainer {
      display: block !important;
      position: static !important;
      inset: auto !important;
      z-index: auto !important;
      overflow: visible !important;
      height: auto !important;
      background: white !important;
    }

    #richEditor, #preview {
      max-width: none !important;
      width: 100% !important;
      padding: 0 !important;
      overflow: visible !important;
      height: auto !important;
      background: white !important;
      color: black !important;
    }

    #codeWrap { display: none !important; }
    /* Only show the active view */
    #richEditor.hidden, #preview.hidden { display: none !important; }
    #richEditor:not(.hidden), #preview:not(.hidden) { display: block !important; }

    /* Page break rules */
    h1, h2, h3 { page-break-after: avoid; break-after: avoid; }
    pre, blockquote, table, img, details { page-break-inside: avoid; break-inside: avoid; }
    p { orphans: 3; widows: 3; }

    /* Clean print colors */
    a { color: #333 !important; text-decoration: underline !important; }
    code { background: #f0f0f0 !important; color: #333 !important; }
    pre { background: #f5f5f5 !important; border: 1px solid #ddd !important; color: #333 !important; }
    th { background: #eee !important; }
    mark { background: #fde68a !important; color: #000 !important; }
  }

  /* Syntax highlighting overrides */
  #richEditor pre code.hljs, #preview pre code.hljs, #splitPreview pre code.hljs {
    padding: 0;
    background: transparent;
  }

  /* Mermaid */
  .mermaid-container { margin: 0.5em 0; }
  .mermaid-container svg { max-width: 100%; }

  /* KaTeX */
  .katex-display { margin: 0.5em 0; overflow-x: auto; }
  .katex-inline { display: inline; }

  /* Superscript / subscript */
  #richEditor sup, #preview sup, #splitPreview sup { vertical-align: super; font-size: 0.75em; }
  #richEditor sub, #preview sub, #splitPreview sub { vertical-align: sub; font-size: 0.75em; }

  /* Split view */
  .split-view { display: flex !important; }
  .split-view > * { flex: 1; min-width: 0; }
  .split-divider {
    width: 1px;
    background: #e4e4e7;
    flex-shrink: 0;
  }
  .dark .split-divider { background: #3f3f46; }

  /* Code editor line numbers */
  .code-wrap { position: relative; display: flex; overflow: hidden; }
  .line-numbers {
    padding: 1.5rem 0.5rem 1.5rem 0.75rem;
    text-align: right;
    user-select: none;
    font-size: 15px;
    line-height: 1.75;
    font-family: 'SF Mono', 'Fira Code', monospace;
    color: #a1a1aa;
    width: 3.5em;
    flex-shrink: 0;
    overflow: hidden;
    white-space: pre;
  }
  .dark .line-numbers { color: #52525b; }
  .code-wrap textarea {
    flex: 1;
    min-width: 0;
  }

  /* Find & replace bar */
  .find-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-bottom: 1px solid #e4e4e7;
    background: #fafafa;
    font-size: 13px;
  }
  .dark .find-bar {
    border-color: #3f3f46;
    background: #18181b;
  }
  .find-bar input {
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #d4d4d8;
    background: #fff;
    color: #18181b;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    width: 180px;
  }
  .dark .find-bar input {
    border-color: #3f3f46;
    background: #09090b;
    color: #fafafa;
  }
  .find-bar input:focus { border-color: #8b5cf6; }
  .find-bar button {
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #d4d4d8;
    background: #fff;
    color: #3f3f46;
    cursor: pointer;
    font-size: 12px;
  }
  .dark .find-bar button {
    border-color: #3f3f46;
    background: #27272a;
    color: #a1a1aa;
  }
  .find-bar button:hover { border-color: #8b5cf6; }
  .find-bar .find-count { color: #a1a1aa; font-size: 11px; min-width: 60px; }

  /* ToC sidebar */
  .toc-panel {
    width: 220px;
    overflow-y: auto;
    padding: 1rem;
    border-right: 1px solid #e4e4e7;
    font-size: 13px;
    flex-shrink: 0;
  }
  .dark .toc-panel { border-color: #3f3f46; }
  .toc-panel a {
    display: block;
    padding: 3px 0;
    color: #71717a;
    text-decoration: none;
    cursor: pointer;
  }
  .toc-panel a:hover { color: #8b5cf6; }
  .toc-panel a.toc-h1 { font-weight: 700; }
  .toc-panel a.toc-h2 { padding-left: 0.75em; }
  .toc-panel a.toc-h3 { padding-left: 1.5em; font-size: 12px; }
  .toc-title { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #a1a1aa; margin-bottom: 0.5rem; }

  /* Templates modal */
  .template-card {
    padding: 12px;
    border: 1px solid #e4e4e7;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .template-card:hover { border-color: #8b5cf6; background: #f5f3ff; }
  .dark .template-card { border-color: #3f3f46; }
  .dark .template-card:hover { border-color: #8b5cf6; background: #1e1b4b; }

  /* Toolbar button active state */
  .tb-active {
    background: #8b5cf6 !important;
    color: #fff !important;
    border-color: #8b5cf6 !important;
  }
</style>
</head>
<body class="h-screen flex flex-col overflow-hidden
  bg-white text-zinc-900
  dark:bg-zinc-950 dark:text-zinc-100
  transition-colors duration-200">

<!-- Top Toolbar -->
<header class="flex items-center justify-between px-4 py-2 shrink-0 border-b
  bg-zinc-50 border-zinc-200
  dark:bg-zinc-900 dark:border-zinc-800">
  <div class="flex items-center gap-3">
    <div class="flex items-center gap-2 text-sm font-semibold tracking-wide font-mono
      text-violet-600 dark:text-violet-400">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <div class="flex items-center gap-2">

    <button onclick="toggleTheme()" class="inline-flex items-center justify-center rounded-md h-8 w-8

      <svg class="w-4 h-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    </button>
    <button onclick="copyPlainLink()" title="Copy link (unencrypted)" class="inline-flex items-center gap-1.5 rounded-md px-3 h-8 text-xs font-medium font-mono
      border border-zinc-200 bg-white hover:bg-zinc-100 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700

      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <button onclick="copyPreviewLink()" title="Copy read-only preview link" class="inline-flex items-center gap-1.5 rounded-md px-3 h-8 text-xs font-medium font-mono
      border border-zinc-200 bg-white hover:bg-zinc-100 dark:border-zinc-700 dark:bg-zinc-800 dark:hover:bg-zinc-700

      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <button onclick="showEncryptModal()" title="Ctrl+E" class="inline-flex items-center gap-1.5 rounded-md px-3 h-8 text-xs font-medium font-mono

      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  bg-violet-600 dark:bg-violet-500 text-white px-6 py-2.5 rounded-lg text-sm font-medium font-mono

<script>
const richEditor = document.getElementById('richEditor');
const codeEditor = document.getElementById('codeEditor');
const previewEl = document.getElementById('preview');
const charCount = document.getElementById('charCount');
const ITERATIONS = 200000;

let currentMode = 'rich'; // 'rich' | 'code' | 'preview'
let markdown = ''; // source of truth

// --- Turndown config ---
const td = new TurndownService({
  headingStyle: 'atx',
  codeBlockStyle: 'fenced',
  emDelimiter: '*',
  bulletListMarker: '-',
  strongDelimiter: '**',
  hr: '---',
});

// GFM plugin (tables, strikethrough, task lists)
if (typeof turndownPluginGfm !== 'undefined') {
  td.use(turndownPluginGfm.gfm);
}

// Table support — convert HTML tables to markdown tables
td.addRule('table', {
  filter: 'table',
  replacement: function(content, node) {
    const rows = Array.from(node.querySelectorAll('tr'));
    if (!rows.length) return content;
    const result = [];
    rows.forEach((row, i) => {
      const cells = Array.from(row.querySelectorAll('th, td'));
      const line = '| ' + cells.map(c => c.textContent.trim()).join(' | ') + ' |';
      result.push(line);
      if (i === 0) {
        result.push('| ' + cells.map(() => '---').join(' | ') + ' |');
      }
    });
    return '\n\n' + result.join('\n') + '\n\n';
  }
});

// Remove default handling of table sub-elements so they don't interfere
['thead', 'tbody', 'tfoot', 'tr', 'th', 'td'].forEach(tag => {
  td.addRule(tag, {
    filter: tag,
    replacement: function(content) { return content; }
  });
});

// Preserve <details>/<summary> as HTML (markdown passes HTML through)
td.addRule('details', {
  filter: 'details',
  replacement: function(content, node) {
    const summary = node.querySelector('summary');
    const summaryText = summary ? summary.textContent.trim() : 'Details';
    const inner = content.replace(summaryText, '').trim();
    return '\n\n<details>\n<summary>' + summaryText + '</summary>\n\n' + inner + '\n\n</details>\n\n';
  }
});
td.addRule('summary', {
  filter: 'summary',
  replacement: (content) => content
});

// Preserve <mark> as ==text==
td.addRule('highlight', {
  filter: 'mark',
  replacement: (content) => '==' + content + '=='
});

// Preserve superscript
td.addRule('superscript', {
  filter: 'sup',
  replacement: (content) => '<sup>' + content + '</sup>'
});

// Preserve subscript
td.addRule('subscript', {
  filter: 'sub',
  replacement: (content) => '<sub>' + content + '</sub>'
});

// Preserve task list checkboxes
td.addRule('taskListItem', {
  filter: (node) => {
    return node.nodeName === 'LI' && node.querySelector('input[type="checkbox"]');
  },
  replacement: (content, node) => {
    const checkbox = node.querySelector('input[type="checkbox"]');
    const checked = checkbox && checkbox.checked;
    const text = content.replace(/^\s*\[[ x]\]\s*/i, '').trim();
    return (checked ? '- [x] ' : '- [ ] ') + text + '\n';
  }
});

// --- Theme ---

function updateHljsTheme() {
  const isDark = document.documentElement.classList.contains('dark');
  document.getElementById('hljs-dark').disabled = !isDark;
  document.getElementById('hljs-light').disabled = isDark;
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.classList.contains('dark');
  html.classList.toggle('dark', !isDark);
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  updateHljsTheme();
}

(function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'light' || (!saved && !prefersDark)) {
    document.documentElement.classList.remove('dark');
  }
  updateHljsTheme();
})();

// --- Mode switching ---

function setMode(mode) {
  // Save content from current mode before switching
  syncFromCurrentMode();

  currentMode = mode;

  // Update mode button styles
  ['modeRich', 'modeCode', 'modePreview'].forEach(id => {
    const btn = document.getElementById(id);
    btn.className = btn.className.replace(/bg-violet-600 text-white|text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/g, '');
  });
  const activeClass = 'bg-violet-600 text-white';
  const inactiveClass = 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800';
  document.getElementById('modeRich').classList.add(...(mode === 'rich' ? activeClass : inactiveClass).split(' '));
  document.getElementById('modeCode').classList.add(...(mode === 'code' ? activeClass : inactiveClass).split(' '));
  document.getElementById('modePreview').classList.add(...(mode === 'preview' ? activeClass : inactiveClass).split(' '));

  // Show/hide panels
  richEditor.classList.toggle('hidden', mode !== 'rich');
  document.getElementById('codeWrap').classList.toggle('hidden', mode !== 'code');
  previewEl.classList.toggle('hidden', mode !== 'preview');

  // Show/hide format buttons
  document.getElementById('formatButtons').classList.toggle('hidden', mode !== 'rich');

  // Load content into target mode
  if (mode === 'rich') {
    richEditor.innerHTML = marked.parse(markdown);
    highlightCode(richEditor);
    renderMermaid(richEditor);
    renderKaTeX(richEditor);
    richEditor.focus();
  } else if (mode === 'code') {
    codeEditor.value = markdown;
    updateLineNumbers();
    codeEditor.focus();
  } else {
    previewEl.innerHTML = marked.parse(markdown);
    highlightCode(previewEl);
    renderMermaid(previewEl);
    renderKaTeX(previewEl);
  }

  // Update split view if active
  if (splitActive) updateSplitPreview();
  updateToC();
  updateCounts();
}

function syncFromCurrentMode() {
  if (currentMode === 'rich') {
    markdown = td.turndown(richEditor.innerHTML);
  } else if (currentMode === 'code') {
    markdown = codeEditor.value;
  }
}

function getMarkdown() {
  syncFromCurrentMode();
  return markdown;
}

function highlightCode(container) {
  if (typeof hljs !== 'undefined') {
    container.querySelectorAll('pre code').forEach(block => {
      hljs.highlightElement(block);
    });
  }
}

function setMarkdown(md) {
  markdown = md;
  if (currentMode === 'rich') {
    richEditor.innerHTML = marked.parse(md);
    highlightCode(richEditor);
  } else if (currentMode === 'code') {
    codeEditor.value = md;
  } else {
    previewEl.innerHTML = marked.parse(md);
    highlightCode(previewEl);
  }
}

// --- Formatting (execCommand for rich mode) ---

function fmt(command, value) {
  if (currentMode !== 'rich') return;
  document.execCommand(command, false, value || null);
  richEditor.focus();
}

function insertCode() {
  if (currentMode !== 'rich') return;
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    const text = range.toString();
    const code = document.createElement('code');
    code.textContent = text || 'code';
    range.deleteContents();
    range.insertNode(code);
    sel.collapseToEnd();
  }
  richEditor.focus();
}

function insertLink() {
  if (currentMode !== 'rich') return;
  const url = prompt('Enter URL:');
  if (url) {
    document.execCommand('createLink', false, url);
  }
  richEditor.focus();
}

function insertHR() {
  if (currentMode !== 'rich') return;
  document.execCommand('insertHorizontalRule');
  richEditor.focus();
}

function insertHighlight() {
  if (currentMode !== 'rich') return;
  const sel = window.getSelection();
  if (sel.rangeCount) {
    const range = sel.getRangeAt(0);
    const text = range.toString();
    if (text) {
      const mark = document.createElement('mark');
      range.surroundContents(mark);
    }
  }
  richEditor.focus();
}

let isWide = localStorage.getItem('wideLayout') === 'true';
function toggleWideLayout() {
  isWide = !isWide;
  localStorage.setItem('wideLayout', isWide);
  applyWideLayout();
}
function applyWideLayout() {
  const targets = document.querySelectorAll('#richEditor, #codeWrap, #preview');
  const icon = document.getElementById('wideIcon');
  targets.forEach(el => {
    el.classList.toggle('max-w-3xl', !isWide);
    el.classList.toggle('max-w-full', isWide);
  });
  if (isWide) {
    icon.innerHTML = '<polyline points="15 6 9 12 15 18"/><polyline points="9 6 3 12 9 18"/><line x1="21" y1="6" x2="21" y2="18"/>';
  } else {
    icon.innerHTML = '<polyline points="9 18 15 12 9 6"/><polyline points="15 18 21 12 15 6"/><line x1="3" y1="6" x2="3" y2="18"/>';
  }
}
applyWideLayout();

let isFullscreen = false;
function toggleFullscreen() {
  isFullscreen = !isFullscreen;
  const area = document.getElementById('editorArea');
  const icon = document.getElementById('fullscreenIcon');
  if (isFullscreen) {
    area.classList.add('fullscreen');
    area.style.background = getComputedStyle(document.body).backgroundColor;
    icon.innerHTML = '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>';
  } else {
    area.classList.remove('fullscreen');
    area.style.background = '';
    icon.innerHTML = '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>';
  }
}

// --- Mermaid ---

let mermaidId = 0;
async function renderMermaid(container) {
  if (typeof mermaid === 'undefined') return;
  const blocks = container.querySelectorAll('code.language-mermaid');
  for (const block of blocks) {
    const pre = block.parentElement;
    const text = block.textContent.trim();
    const id = 'mermaid-' + (mermaidId++);
    const div = document.createElement('div');
    div.className = 'mermaid-container';
    try {
      const { svg } = await mermaid.render(id, text);
      div.innerHTML = svg;
      pre.replaceWith(div);
    } catch (e) {
      console.warn('Mermaid error:', e);
    }
  }
}

// --- KaTeX ---

function renderKaTeX(container) {
  if (typeof katex === 'undefined') return;
  // Block math: $$...$$
  const html = container.innerHTML;
  const blockReplaced = html.replace(/\$\$([^$]+)\$\$/g, (_, tex) => {
    try {
      return '<div class="katex-display">' + katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false }) + '</div>';
    } catch (e) { return _; }
  });
  // Inline math: $...$
  const inlineReplaced = blockReplaced.replace(/\$([^$\n]+)\$/g, (_, tex) => {
    try {
      return '<span class="katex-inline">' + katex.renderToString(tex.trim(), { throwOnError: false }) + '</span>';
    } catch (e) { return _; }
  });
  if (inlineReplaced !== html) container.innerHTML = inlineReplaced;
}

// --- Line numbers ---

function updateLineNumbers() {
  const lines = codeEditor.value.split('\n').length;
  const el = document.getElementById('lineNumbers');
  el.textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
}

// --- Split view ---

let splitActive = false;
function toggleSplit() {
  splitActive = !splitActive;
  const divider = document.getElementById('splitDivider');
  const splitPrev = document.getElementById('splitPreview');
  const container = document.getElementById('editorContainer');
  divider.classList.toggle('hidden', !splitActive);
  splitPrev.classList.toggle('hidden', !splitActive);
  if (splitActive) {
    container.style.flex = '1';
    container.style.minWidth = '0';
    updateSplitPreview();
  }
}

function updateSplitPreview() {
  const splitPrev = document.getElementById('splitPreview');
  if (!splitActive) return;
  const md = getMarkdown();
  splitPrev.innerHTML = marked.parse(md);
  highlightCode(splitPrev);
  renderMermaid(splitPrev);
  renderKaTeX(splitPrev);
}

// Scroll sync for split view
function syncScroll(source) {
  if (!splitActive) return;
  const splitPrev = document.getElementById('splitPreview');
  const ratio = source.scrollTop / (source.scrollHeight - source.clientHeight || 1);
  splitPrev.scrollTop = ratio * (splitPrev.scrollHeight - splitPrev.clientHeight);
}

// --- Table of Contents ---

let tocActive = false;
function toggleToC() {
  tocActive = !tocActive;
  document.getElementById('tocPanel').classList.toggle('hidden', !tocActive);
  if (tocActive) updateToC();
}

function updateToC() {
  if (!tocActive) return;
  const md = getMarkdown();
  const headings = [];
  md.split('\n').forEach(line => {
    const m = line.match(/^(#{1,3})\s+(.+)/);
    if (m) headings.push({ level: m[1].length, text: m[2].replace(/[*_`~=]/g, '') });
  });
  const list = document.getElementById('tocList');
  list.innerHTML = headings.map(h =>
    '<a class="toc-h' + h.level + '" onclick="scrollToHeading(\'' + h.text.replace(/'/g, "\\'") + '\')">' + h.text + '</a>'
  ).join('');
}

function scrollToHeading(text) {
  const container = currentMode === 'rich' ? richEditor : previewEl;
  const headings = container.querySelectorAll('h1, h2, h3');
  for (const h of headings) {
    if (h.textContent.trim() === text) {
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
  }
}

// --- Find & Replace ---

let findActive = false;
function toggleFind() {
  findActive = !findActive;
  document.getElementById('findBar').classList.toggle('hidden', !findActive);
  if (findActive) document.getElementById('findInput').focus();
}

function doFind() {
  const query = document.getElementById('findInput').value;
  const countEl = document.getElementById('findCount');
  if (!query) { countEl.textContent = ''; clearHighlights(); return; }
  const container = currentMode === 'rich' ? richEditor : (currentMode === 'preview' ? previewEl : null);
  if (!container) {
    // Code mode: count in textarea
    const text = codeEditor.value;
    const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const matches = text.match(regex);
    countEl.textContent = (matches ? matches.length : 0) + ' found';
    return;
  }
  clearHighlights();
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
  let count = 0;
  const ranges = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    const text = node.textContent;
    let idx = text.toLowerCase().indexOf(query.toLowerCase());
    while (idx !== -1) {
      const range = document.createRange();
      range.setStart(node, idx);
      range.setEnd(node, idx + query.length);
      ranges.push(range);
      count++;
      idx = text.toLowerCase().indexOf(query.toLowerCase(), idx + 1);
    }
  }
  ranges.forEach(r => {
    const mark = document.createElement('span');
    mark.className = 'find-highlight';
    mark.style.cssText = 'background:#fbbf24;color:#000;border-radius:2px;';
    r.surroundContents(mark);
  });
  countEl.textContent = count + ' found';
}

function clearHighlights() {
  const container = currentMode === 'rich' ? richEditor : previewEl;
  container.querySelectorAll('.find-highlight').forEach(el => {
    el.replaceWith(...el.childNodes);
  });
}

function doReplace() {
  const query = document.getElementById('findInput').value;
  const replacement = document.getElementById('replaceInput').value;
  if (!query) return;
  if (currentMode === 'code') {
    const idx = codeEditor.value.toLowerCase().indexOf(query.toLowerCase());
    if (idx !== -1) {
      codeEditor.value = codeEditor.value.substring(0, idx) + replacement + codeEditor.value.substring(idx + query.length);
      updateLineNumbers();
      autoSave();
    }
  } else {
    syncFromCurrentMode();
    const idx = markdown.toLowerCase().indexOf(query.toLowerCase());
    if (idx !== -1) {
      markdown = markdown.substring(0, idx) + replacement + markdown.substring(idx + query.length);
      setMarkdown(markdown);
      autoSave();
    }
  }
  doFind();
}

function doReplaceAll() {
  const query = document.getElementById('findInput').value;
  const replacement = document.getElementById('replaceInput').value;
  if (!query) return;
  syncFromCurrentMode();
  const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  markdown = markdown.replace(regex, replacement);
  setMarkdown(markdown);
  if (currentMode === 'code') updateLineNumbers();
  autoSave();
  doFind();
}

// --- Compression ---

async function compressText(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate'));
  const buf = await new Response(stream).arrayBuffer();
  return bufToBase64(buf);
}

async function tryDecompress(buf, format) {
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream(format));
  const reader = stream.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const combined = new Uint8Array(chunks.reduce((a, c) => a + c.length, 0));
  let offset = 0;
  for (const chunk of chunks) { combined.set(chunk, offset); offset += chunk.length; }
  return new TextDecoder().decode(combined);
}

async function decompressText(encoded) {
  const buf = base64ToBuf(encoded);
  // Detect format from header bytes
  const bytes = new Uint8Array(buf);
  if (bytes[0] === 0x1f && bytes[1] === 0x8b) {
    return tryDecompress(buf, 'gzip');
  }
  if (bytes[0] === 0x78) {
    return tryDecompress(buf, 'deflate');
  }
  return tryDecompress(buf, 'deflate-raw');
}

          sel.collapseToEnd();
        }

        showToast('Image pasted');

      reader.readAsDataURL(file);

// --- Password generator ---

function generatePassword() {
  const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const lower = 'abcdefghjkmnpqrstuvwxyz';
  const digits = '23456789';
  const symbols = '!@#$%&*?+-=';
  const all = upper + lower + digits + symbols;
  const len = 16;
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  // Guarantee at least one of each type
  let pw = [
    upper[arr[0] % upper.length],
    lower[arr[1] % lower.length],
    digits[arr[2] % digits.length],
    symbols[arr[3] % symbols.length],
  ];
  for (let i = 4; i < len; i++) pw.push(all[arr[i] % all.length]);
  // Shuffle
  for (let i = pw.length - 1; i > 0; i--) {
    const j = arr[i] % (i + 1);
    [pw[i], pw[j]] = [pw[j], pw[i]];
  }
  const password = pw.join('');
  const inp = document.getElementById('encryptPin');
  inp.value = password;
  inp.type = 'text';
  inp.dispatchEvent(new Event('input'));
  navigator.clipboard.writeText(password).then(() => {
    showToast('Password generated & copied');
  });
}

// --- Crypto ---

function strToBytes(s) { return new TextEncoder().encode(s); }
function bytesToStr(b) { return new TextDecoder().decode(b); }

function bufToBase64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function base64ToBuf(b64) {
  b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function deriveKey(password, salt) {
  const keyMaterial = await crypto.subtle.importKey('raw', strToBytes(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
    keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encrypt(plaintext, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, strToBytes(plaintext));
  const packed = new Uint8Array(salt.length + iv.length + new Uint8Array(ciphertext).length);
  packed.set(salt, 0);
  packed.set(iv, 16);
  packed.set(new Uint8Array(ciphertext), 28);
  return bufToBase64(packed.buffer);
}

async function decrypt(encoded, password) {
  const packed = new Uint8Array(base64ToBuf(encoded));
  const salt = packed.slice(0, 16);
  const iv = packed.slice(16, 28);
  const ciphertext = packed.slice(28);
  const key = await deriveKey(password, salt);
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  return bytesToStr(plaintext);
}

async function encryptNote() {
  const pin = document.getElementById('encryptPin').value;
  const errEl = document.getElementById('encryptError');
  if (!pin) {
    errEl.textContent = 'Please enter a password';
    const inp = document.getElementById('encryptPin');
    inp.classList.remove('animate-shake'); inp.offsetHeight; inp.classList.add('animate-shake');
    return;
  }
  try {
    const encoded = await encrypt(getMarkdown(), pin);
    const url = location.origin + location.pathname + '#enc:' + encoded;
    await navigator.clipboard.writeText(url);
    closeModal('encryptModal');
    setStatus('Encrypted & copied', 'encrypted');
    showToast('Encrypted link copied to clipboard');
  } catch (err) {
    errEl.textContent = 'Encryption failed: ' + err.message;
  }
}

async function decryptNote() {
  const pin = document.getElementById('decryptPin').value;
  const errEl = document.getElementById('decryptError');
  if (!pin) {
    errEl.textContent = 'Please enter the password';
    const inp = document.getElementById('decryptPin');
    inp.classList.remove('animate-shake'); inp.offsetHeight; inp.classList.add('animate-shake');
    return;
  }
  try {
    const hash = decodeURIComponent(location.hash.substring(1));
    const encoded = hash.startsWith('enc:') ? hash.substring(4) : hash;
    const text = await decrypt(encoded, pin);
    setMarkdown(text);
    closeModal('decryptModal');
    setStatus('Decrypted', 'saved');
    updateCounts();
    history.replaceState(null, '', location.pathname);
  } catch (err) {
    errEl.textContent = 'Wrong password or corrupted data';
    const inp = document.getElementById('decryptPin');
    inp.classList.remove('animate-shake'); inp.offsetHeight; inp.classList.add('animate-shake');
  }
}

function downloadNote() {
  const md = getMarkdown();
  if (!md.trim()) return;
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'note-' + new Date().toISOString().slice(0, 10) + '.md';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Note downloaded');
}

  const prevMode = currentMode;
  if (currentMode !== 'preview') setMode('preview');
  setTimeout(() => {
    window.print();
    if (prevMode !== 'preview') setMode(prevMode);
  }, 100);
}

Switch between three modes using the toggle in the toolbar:

1. **Rich** — WYSIWYG editing, like Word or Google Docs
2. **Markdown** — raw markdown source for power users
3. **Preview** — clean, read-only rendered view

// Encrypt a note with AES-256-GCM
async function encryptAndShare(note, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ciphertext = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv }, key, new TextEncoder().encode(note)
  );
  return bufToBase64(ciphertext);
}

## Collapsible Sections :folder:

Click to expand these sections:

<details>
<summary>How does the encryption work?</summary>

The app uses the **Web Crypto API** built into your browser:

1. Your password is fed through **PBKDF2** with 200,000 iterations and a random salt
2. This derives a **256-bit AES-GCM key**
3. Your note is encrypted with a random **IV** (initialization vector)
4. The salt + IV + ciphertext are packed and base64-encoded into the URL

No one can decrypt without your password — not even someone with the source code.

</details>

<details>
<summary>What are the URL size limits?</summary>

Most browsers support URLs up to **~2MB**. The footer shows the current URL size. For very large notes, consider downloading as a .md file instead of sharing via URL.

</details>

<details>
<summary>Can I paste images?</summary>

Yes! In **Rich mode**, just paste an image from your clipboard (\`Ctrl+V\`). The image is embedded as base64 data directly in the note. Note that images will significantly increase the URL size.

</details>

## Split View :eyes:

Click the **Split** button in the toolbar to enable side-by-side editing:

- Left side: your editor (Rich or Markdown)
- Right side: live rendered preview
- Great for checking how your markdown looks in real-time

## Find & Replace :bulb:

Press \`Ctrl+F\` or click the **Find** button to open Find & Replace:

- Replace one match or all matches at once

### How to encrypt & share:

1. Write your note :memo:
2. Click **Encrypt** (or press \`Ctrl+E\`) :lock:
3. Set a strong password :key:
4. The encrypted link is copied to your clipboard :check:
5. Send the link one way, the password another way :shield:

let inReaderMode = false;
function enterReaderMode() {
  inReaderMode = true;
  setMode('preview');
  document.querySelector('header').classList.add('hidden');
  document.getElementById('formatBar').classList.add('hidden');
  document.querySelector('footer').classList.add('hidden');
  document.getElementById('findBar').classList.add('hidden');
  document.getElementById('readerControls').classList.remove('hidden');
  const area = document.getElementById('editorArea');
  area.style.position = 'fixed';
  area.style.inset = '0';
  area.style.zIndex = '40';
  area.style.background = getComputedStyle(document.body).backgroundColor;
  const prev = document.getElementById('preview');
  prev.style.maxWidth = '48rem';
  prev.style.margin = '0 auto';
  prev.style.paddingTop = '3rem';
  prev.style.paddingBottom = '3rem';
  updateToC();
}

function exitReaderMode() {
  inReaderMode = false;
  document.querySelector('header').classList.remove('hidden');
  document.getElementById('formatBar').classList.remove('hidden');
  document.querySelector('footer').classList.remove('hidden');
  document.getElementById('readerControls').classList.add('hidden');
  // Close reader ToC if open
  if (tocActive) toggleToC();
  const area = document.getElementById('editorArea');
  area.style.position = '';
  area.style.inset = '';
  area.style.zIndex = '';
  area.style.background = '';
  const prev = document.getElementById('preview');
  prev.style.maxWidth = '';
  prev.style.margin = '';
  prev.style.paddingTop = '';
  prev.style.paddingBottom = '';
  setMode('rich');
  // Remove preview: prefix from hash
  const h = location.hash.substring(1);
  if (h.startsWith('preview:')) {
    history.replaceState(null, '', '#' + h.substring(8));
  }
}

function toggleReaderToC() {
  toggleToC();
  // Adjust preview centering when ToC is open
  const prev = document.getElementById('preview');
  if (tocActive) {
    prev.style.margin = '0';
  } else {
    prev.style.margin = '0 auto';
  }
}

function toggleReaderTheme() {
  toggleTheme();
  // Update reader background
  const area = document.getElementById('editorArea');
  area.style.background = getComputedStyle(document.body).backgroundColor;
}

// Try both events to ensure it fires
if (document.readyState === 'complete') {
  initApp();
} else {
  window.addEventListener('load', initApp);
}
